<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1714">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Toque</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="top">
  <button class="back" id="back" hidden aria-label="Zurück">‹</button>
  <h1 id="title">Toque</h1>
  <nav class="tabs">
    <button data-tab="recipes" class="tab on" id="tabRecipes"></button>
    <button data-tab="shopping" class="tab" id="tabShopping"></button>
    <button data-tab="add" class="tab" id="tabAdd">+</button>
  </nav>
</header>
<div id="status" class="status" hidden></div>
<main>
  <section id="recipes">
    <input id="q" class="search" type="search" autocomplete="off">
    <div class="chips" id="chips"></div>
    <p class="count" id="count"></p>
    <div class="grid" id="grid"></div>
    <button class="more" id="more" hidden></button>
  </section>
  <section id="detail" hidden></section>
  <section id="shopping" hidden></section>
  <section id="add" hidden>
    <p class="help" id="addHelp"></p>
    <div class="actions"><button class="btn" id="copyPrompt"></button></div>
    <p class="note" id="copyManual" hidden></p>
    <textarea id="promptText" class="paste small" readonly hidden></textarea>
    <textarea id="paste" class="paste" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
    <div class="actions"><button class="btn primary" id="importSave"></button></div>
    <div id="importResult"></div>
  </section>
</main>
<div id="toast" class="toast" hidden></div>
<script src="/app.js"></script>
</body>
</html>
